services:
  postgres:
    image: postgres:16
    container_name: openwebui-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: openwebui
      POSTGRES_USER: openwebui
      POSTGRES_PASSWORD: openwebui
    ports:
      - "8050:5432"
    volumes:
      - openwebui_postgres_data:/var/lib/postgresql/data

  open-webui:
    image: openwebui:v1.0.0
    container_name: open-webui
    depends_on:
      - postgres
      - sanitizer
      - nlp-service
    ports:
      - "2026:2026"
    volumes:
      - open-webui:/app/backend/data
    env_file:
      - ldap.env
      - params.env
    environment:
      SANITIZER_URL: http://sanitizer:8080/v1/sanitize
    restart: unless-stopped

  sanitizer:
    build:
      context: ./sanitizer
    image: sanitizer:latest  
    container_name: sanitizer
    environment:
      NER_URL: "http://nlp-service:8000/ner"
    ports:
      - "2027:8080"
    restart: unless-stopped

  nlp-service:
    build:
      context: ./nlp-service
    image: nlp-service:latest  
    container_name: nlp-service
    ports:
      - "2028:8000"
    volumes:
      - hf_cache:/cache/huggingface
      - torch_cache:/cache/torch
    environment:
      TRANSFORMERS_CACHE: /cache/huggingface
      HF_HOME: /cache/huggingface
      TORCH_HOME: /cache/torch
      DEVICE: cpu
    restart: unless-stopped

volumes:
  open-webui: {}
  openwebui_postgres_data: {}
  hf_cache: {}
  torch_cache: {}